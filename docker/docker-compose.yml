# RetroArr — Docker Compose
#
# Linux hosts (Synology, Unraid, Proxmox, a Pi...): keep `network_mode: host`.
#   Plex / Jellyfin / Emby then auto-discover RetroArr as an HDHomeRun tuner
#   (UDP 65001 broadcast) — that only works when the container shares the
#   host's network.
#
# Docker Desktop on Windows / macOS: host networking is not available. Delete
#   `network_mode: host`, uncomment the `ports:` block, and add the tuner
#   manually in your media server with http://<your-ip>:8888
#
# NOTE: Compose refuses to start a service that has BOTH network_mode: host
#       and a ports: list — pick one.

services:
  retroarr:
    image: f00d4tehg0dz/retroarr:latest
    container_name: retroarr
    restart: unless-stopped
    network_mode: host
    # ports:
    #   - "8888:8888"
    #   - "65001:65001/udp"   # HDHomeRun discovery (best effort in bridge mode)
    #   - "1900:1900/udp"     # SSDP
    volumes:
      # db.json + installed plugins live here
      - retroarr-db:/app/server/db
      # Optional: your own commercial clips for ad breaks
      # - ./commercials:/app/server/data/commercials:ro
      # Optional: YouTube cookies (Netscape format) if you hit "Sign in to
      # confirm you're not a bot" — export from your browser, then set
      # YTDLP_COOKIES below.
      # - ./cookies.txt:/app/server/db/cookies.txt:ro
    environment:
      # ── Required ────────────────────────────────────────────────
      - REMOTE_API_URL=https://retroarr-api.f00d.me
      # ── Optional ────────────────────────────────────────────────
      - DEVICE_NAME=${DEVICE_NAME:-RetroArr}
      - STREAM_QUALITY=${STREAM_QUALITY:-720p}   # 360p | 480p | 720p | 1080p
      - TUNER_COUNT=${TUNER_COUNT:-4}
      - TZ=${TZ:-America/New_York}
      - PORT=8888
      # Pin the HDHomeRun device ID (8 hex chars). Leave unset to auto-generate
      # once and persist it in db.json.
      # - DEVICE_ID=104A7F3C
      # In bridge mode, the LAN IP media servers should use to reach RetroArr
      # - ADVERTISE_IP=192.168.1.50
      # yt-dlp tuning
      - YTDLP_AUTO_UPDATE=true            # refresh yt-dlp on every start
      # - YTDLP_COOKIES=/app/server/db/cookies.txt
      # - YTDLP_EXTRA_ARGS=--extractor-args youtube:player_client=default
      # - YTDLP_PLAYLIST_LIMIT=1000

volumes:
  retroarr-db:
    driver: local
