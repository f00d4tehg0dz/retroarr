name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Syntax-check the server before spending minutes on an image build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint server (syntax)
        run: |
          for f in $(find server/src -name '*.js'); do node --check "$f"; done
          if grep -q $'\r' docker/entrypoint.sh; then echo "entrypoint.sh has CRLF line endings"; exit 1; fi

      - name: Set up QEMU (arm64 builds for ARM NAS / Raspberry Pi)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push on main) multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            f00d4tehg0dz/retroarr:latest
            f00d4tehg0dz/retroarr:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
